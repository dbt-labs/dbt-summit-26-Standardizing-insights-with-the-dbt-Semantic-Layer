metrics:
- name: cost_ratio
  description: Ratio of total supplier costs to gross item sales amount.
  label: Cost Ratio
  type: ratio
  type_params:
    denominator:
      name: gross_item_sales_amount
    numerator:
      name: total_supplier_cost
- name: cumulative_net_sales_ytd
  description: Year-to-date cumulative net sales amount.
  label: Cumulative Net Sales (YTD)
  type: cumulative
  type_params:
    grain_to_date: year
    measure:
      name: net_item_sales_amount
- name: gross_profit
  description: Gross profit calculated by subtracting total supplier costs from net
    item sales amount.
  label: Gross Profit
  type: derived
  type_params:
    expr: net_item_sales_amount - total_supplier_cost
    metrics:
    - name: net_item_sales_amount
    - name: total_supplier_cost