metrics:
- name: cost_ratio
  description: Ratio of total supplier cost to gross item sales amount.
  label: Cost Ratio
  type: ratio
  type_params:
    denominator:
      name: gross_item_sales_amount
    numerator:
      name: total_supplier_cost

- name: cumulative_net_sales_by_year
  description: Cumulative net sales by year
  label: Cumulative Net Sales by Year
  type: cumulative
  type_params:
    grain_to_date: year
    measure:
      name: net_item_sales_amount

- name: gross_profit
  description: Gross profit from each order item.
  label: Gross Profit
  type: derived
  type_params:
    expr: net_item_sales_amount - total_supplier_cost
    metrics:
    - name: net_item_sales_amount
    - name: total_supplier_cost

- name: average_sales_per_customer
  description: Average sales per customer based on net item sales amount.
  label: Average Sales per Customer
  type: ratio
  type_params:
    denominator:
      name: count_order
    numerator:
      name: net_item_sales_amount