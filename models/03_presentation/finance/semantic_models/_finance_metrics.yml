metrics:
- name: gross_profit
  description: Gross profit calculated by subtracting total supplier costs from total
    net sales.
  label: Gross Profit
  type: derived
  type_params:
    expr: net_item_sales_amount - total_supplier_cost
    metrics:
    - name: net_item_sales_amount
    - name: total_supplier_cost
- name: cost_ratio
  description: a ratio of cost to gross sales
  label: Cost Ratio 
  type: ratio
  type_params:
    numerator:
      name: total_supplier_cost
    denominator: 
      name: gross_item_sales_amount
- name: net_cumulative_sls_by_year
  description: net cumalitive sales by year
  label: net Cumulative Sales by Year
  type: cumulative
  type_params:
    measure:
      name: net_item_sales_amount
    cumulative_type_params:
      window: 1 year
- name: average_sales_per_customer
  description: Average sales per customer based on net item sales amount.
  label: Average Sales per Customer
  type: ratio
  type_params:
    denominator:
      name: count_order
    numerator:
      name: net_item_sales_amount


