metrics:
  - name: gross_profit
    description: Gross profit calculated by subtracting total supplier costs from total
      net item sales costs.
    label: Gross Profit
    type: derived
    type_params:
      expr: net_item_sales_amount - total_supplier_cost
      metrics:
      - name: net_item_sales_amount
      - name: total_supplier_cost
  - name: cost_to_gross_sales_ratio
    description: Ratio of supplier cost to gross item sales amount
    label: Cost to Gross Sales Ratio
    type: ratio
    type_params:
      denominator:
        name: gross_item_sales_amount
      numerator:
        name: supplier_cost

  - name: net_cumulative_sales_by_year
    description: Net cumulative sales by year
    label: Net Cumulative Sales by Year
    type: cumulative
    type_params:
      grain_to_date: year
      measure:
        name: net_item_sales_amount


  - name: avg_sales_per_customer
    description: Average sales per customer
    label: Average Sales per Customer
    type: derived
    type_params:
      expr: net_item_sales_amount / count_order
      metrics:
      - name: net_item_sales_amount
      - name: count_order