metrics:
- name: total_orders
  description: Total number of distinct orders
  label: Total Orders
  type: simple
  type_params:
    measure:
      name: count_order

- name: cost_ratio
  description: Ratio of total supplier cost to gross item sales amount
  label: Cost Ratio
  type: ratio
  type_params:
    denominator:
      name: gross_item_sales_amount
    numerator:
      name: total_supplier_cost

- name: net_cumulative_sales_by_year
  description: Net cumulative sales by year
  label: Net Cumulative Sales by Year
  type: cumulative
  type_params:
    grain_to_date: year
    measure:
      name: net_item_sales_amount

- name: gross_profit
  description: Gross profit from each order item.
  label: Gross Profit
  type: derived
  type_params:
    expr: gross_item_sales_amount - total_supplier_cost
    metrics:
    - name: gross_item_sales_amount
    - name: total_supplier_cost

- name: avg_sales_per_customer
  description: Average sales per customer
  label: Average Sales per Customer
  type: ratio
  type_params:
    denominator:
      name: count_customer
    numerator:
      name: gross_item_sales_amount
