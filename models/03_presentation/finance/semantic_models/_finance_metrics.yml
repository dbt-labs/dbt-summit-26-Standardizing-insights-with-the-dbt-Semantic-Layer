metrics:
- name: cost_ratio
  description: Ratio of total supplier cost to gross item sales amount.
  label: Cost Ratio
  type: ratio
  type_params:
    denominator:
      name: gross_item_sales_amount
    numerator:
      name: total_supplier_cost
      
- name: gross_profit
  description: Gross profit calculated by subtracting total supplier costs from total
    net sales.
  label: Gross Profit
  type: derived
  type_params:
    expr: net_item_sales_amount - total_supplier_cost
    metrics:
    - name: net_item_sales_amount
    - name: total_supplier_cost

- name: cumulative_net_sales_by_year
  description: Net cumulative sales by year
  label: Cumulative Net Sales by Year
  type: cumulative
  type_params:
    grain_to_date: year
    measure:
      name: net_item_sales_amount


- name: avg_sale_per_customer
  description: Average sale amount per customer
  label: Average Sale per Customer
  type: derived
  type_params:
    expr: net_item_sales_amount / count_order
    metrics:
    - name: net_item_sales_amount
    - name: count_order