version: 2

groups:
  - name: finance
    owner:
      email: finance@jaffleshop.com
      name: Finance Person

metrics:
- name: cost_ratio
  description: Ratio of total supplier cost to gross item sales amount.
  label: Cost Ratio
  type: ratio
  type_params:
    denominator:
      name: gross_item_sales_amount
    numerator:
      name: total_supplier_cost
- name: net_cumulative_sales_by_year
  description: Net cumulative sales by year
  label: Net Cumulative Sales by Year
  type: cumulative
  type_params:
    grain_to_date: year
    measure:
      name: net_item_sales_amount
- name: gross_profit
  description: Gross profit from sales
  label: Gross Profit
  type: derived
  type_params:
    expr: gross_item_sales_amount - total_supplier_cost
    metrics:
    - name: gross_item_sales_amount
      alias: gross_item_sales_amount
    - name: total_supplier_cost
      alias: total_supplier_cost
- name: avg_sales_per_customer
  description: Average sales per customer
  label: Average Sales Per Customer
  type: ratio
  type_params:
    denominator:
      name: count_customer
    numerator:
      name: net_item_sales_amount