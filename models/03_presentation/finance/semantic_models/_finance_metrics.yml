version: 2

metrics:

  - name: cost_to_gross_sales_ratio
    description: Ratio of total supplier cost to gross item sales amount.
    label: Cost to Gross Sales Ratio
    type: ratio
    type_params:
      denominator:
        name: gross_item_sales_amount
      numerator:
        name: total_supplier_cost

  - name: cumulative_net_sales_ytd
    description: Year-to-date cumulative net sales amount
    label: Cumulative Net Sales (YTD)
    type: cumulative
    type_params:
      grain_to_date: year
      measure:
        name: net_item_sales_amount

  - name: gross_profit
    description:
      Gross profit calculated as net item sales amount minus total supplier
      cost.
    label: Gross Profit
    type: derived
    type_params:
      expr: net_item_sales_amount - total_supplier_cost
      metrics:
        - name: net_item_sales_amount
        - name: total_supplier_cost

  - name: average_sales_per_customer
    description: Average sales amount per customer.
    label: Average Sales per Customer
    type: ratio
    type_params:
      denominator:
        name: count_order
        ##filter: "{{ref('customer_id')}} IS NOT NULL"
      numerator:
        name: gross_item_sales_amount
