metrics:
- name: cost_to_gross_sales_ratio
  description: Ratio of total supplier cost to gross item sales amount
  label: Cost to Gross Sales Ratio
  type: ratio
  type_params:
    denominator:
      name: gross_item_sales_amount
    numerator:
      name: total_supplier_cost
- name: cumulative_sales
  description: Net cumulative sales by year
  label: Cumulative Net Sales by Year
  type: cumulative
  type_params:
    grain_to_date: year
    measure:
      name: net_item_sales_amount
- name: gross_profit
  description: Gross profit calculated as net item sales amount minus total supplier
    cost.
  label: Gross Profit
  type: derived
  type_params:
    expr: net_item_sales_amount - total_supplier_cost
    metrics:
    - name: net_item_sales_amount
    - name: total_supplier_cost
- name: avg_sales_per_customer
  description: Average sales per customer calculated as net item sales amount divided
    by count of distinct customers.
  label: Average Sales per Customer
  type: ratio
  type_params:
    denominator:
      name: count_order
    numerator:
      name: net_item_sales_amount