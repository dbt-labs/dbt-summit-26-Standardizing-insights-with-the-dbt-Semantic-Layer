version: 2

metrics:
- name: gross_profit
  description: Gross profit calculated as total net sales minus total costs.
  label: Gross Profit
  type: derived
  type_params:
    expr: net_item_sales_amount - total_supplier_cost
    metrics:
    - name: net_item_sales_amount
      alias: net_item_sales_amount
    - name: total_supplier_cost
      alias: total_supplier_cost