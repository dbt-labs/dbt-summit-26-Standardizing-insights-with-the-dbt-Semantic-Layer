metrics:
- name: gross_profit
  description: Gross profit calculated by subtracting total supplier cost from net
    item sales amount.
  label: Gross Profit
  type: derived
  type_params:
    expr: net_item_sales_amount - total_supplier_cost
    metrics:
    - name: net_item_sales_amount
    - name: total_supplier_cost
- name: cost_to_gross_sales_ratio
  description: Ratio of total supplier cost to gross item sales amount.
  label: Cost to Gross Sales Ratio
  type: ratio
  type_params:
    denominator:
      name: gross_item_sales_amount
    numerator:
      name: total_supplier_cost
- name: cumulative_net_item_sales_amount_ytd
  description: Year-to-date cumulative net item sales amount
  label: Cumulative Net Item Sales Amount (YTD)
  type: cumulative
  type_params:
    grain_to_date: year
    measure:
      name: net_item_sales_amount
- name: cumulative_net_sales_per_customer
  description: Cumulative net sales per customer over all time.
  label: Cumulative Net Sales per Customer (All-Time)
  type: cumulative
  type_params:
    measure:
      name: net_item_sales_amount