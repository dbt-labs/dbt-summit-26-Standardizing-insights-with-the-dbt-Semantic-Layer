semantic_models:
- name: order_items
  description: Order items fact table with detailed information on each order item,
    including pricing, discounts, and dates.
  model: ref('fct_order_items')
  defaults:
    agg_time_dimension: order_date
  entities:
  - name: order_item
    type: primary
    expr: order_item_id
  - name: order
    type: foreign
    expr: order_id
  - name: customer
    type: foreign
    expr: customer_id
  - name: part
    type: foreign
    expr: part_id
  - name: supplier
    type: foreign
    expr: supplier_id
  dimensions:
  - name: order_date
    description: Date of the order
    type: time
    type_params:
      time_granularity: day
  - name: status_code
    description: Status of the order item
    expr: order_item_status_code
    type: categorical
  - name: return_flag
    description: Flag indicating if the item was returned
    type: categorical
  - name: line_number
    description: Line number of the order item
    type: categorical
  - name: ship_date
    description: Date the item was shipped
    type: time
    type_params:
      time_granularity: day
  - name: commit_date
    description: Date the order was committed
    type: time
    type_params:
      time_granularity: day
  - name: receipt_date
    description: Date the item was received
    type: time
    type_params:
      time_granularity: day
  - name: ship_mode
    description: Mode of shipment
    type: categorical
  measures:
  - name: supplier_cost
    description: Cost from the supplier
    agg: sum
    create_metric: true
  - name: total_supplier_cost
    description: Total cost from the supplier for the quantity ordered
    agg: sum
    create_metric: true
  - name: base_price
    description: Base price of the item
    agg: sum
    create_metric: true
  - name: discount_percentage
    description: Discount percentage applied to the item
    agg: average
    create_metric: true
  - name: discounted_price
    description: Price after discount
    agg: sum
    create_metric: true
  - name: tax_rate
    description: Tax rate applied to the item
    agg: average
    create_metric: true
  - name: quantity
    description: Total units ordered
    agg: sum
    create_metric: true
  - name: gross_item_sales_amount
    description: Gross sales amount of the item
    agg: sum
    create_metric: true
  - name: discounted_item_sales_amount
    description: Sales amount after discount
    agg: sum
    create_metric: true
  - name: item_discount_amount
    description: Total discount amount on the item
    agg: sum
    create_metric: true
  - name: item_tax_amount
    description: Total tax amount on the item
    agg: sum
    create_metric: true
  - name: net_item_sales_amount
    description: Net sales amount after discounts and taxes
    agg: sum
    create_metric: true
  - name: count_order_item
    agg: count
    create_metric: true
    expr: order_item_id
  - name: count_order
    agg: count_distinct
    create_metric: true
    expr: order_id
  - name: count_part
    agg: count_distinct
    create_metric: true
    expr: part_id
  - name: count_supplier
    agg: count_distinct
    create_metric: true
    expr: supplier_id

metrics:
- name: gross_profit
  description: Gross profit calculated by subtracting total supplier cost from net
    item sales amount.
  label: Gross Profit
  type: derived
  type_params:
    expr: net_item_sales_amount - total_supplier_cost
    metrics:
    - name: net_item_sales_amount
    - name: total_supplier_cost
- name: cost_ratio
  description: Ratio of total supplier cost to gross item sales amount.
  label: Cost Ratio
  type: ratio
  type_params:
    denominator:
      name: gross_item_sales_amount
    numerator:
      name: total_supplier_cost
- name: net_cumulative_sales_by_year
  description: Net cumulative sales amount aggregated by year.
  label: Net Cumulative Sales by Year
  type: cumulative
  type_params:
    grain_to_date: year
    measure:
      name: net_item_sales_amount
- name: gross_profit
  description: Gross profit calculated by subtracting total supplier cost from net
    item sales amount.
  label: Gross Profit
  type: derived
  type_params:
    expr: net_item_sales_amount - total_supplier_cost
    metrics:
    - name: net_item_sales_amount
    - name: total_supplier_cost
- name: average_sales_per_customer
  description: Average sales per customer calculated by dividing net item sales amount
    by count of customers.
  label: Average Sales per Customer
  type: ratio
  type_params:
    denominator:
      name: count_order
    numerator:
      name: net_item_sales_amount