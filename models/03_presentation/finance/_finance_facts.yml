models:
  - name: fct_order_items
    description: Order items fact table with detailed sales and order information.
    semantic_model:
      enabled: true
      name: sem_order_items

    agg_time_dimension: order_date

    columns:
      # Entities
      - name: order_item_id
        description: '{{ doc("order_item_id") }}'
        data_tests:
          - unique
          - not_null
        entity:
          type: primary
          name: order_item

      - name: order_id
        description: foreign id for orders
        entity:
          type: foreign
          name: order_id  # "order" is a reserved word so we must reference the order in this way

      - name: customer_id
        description: foreign id for customers
        entity:
          type: foreign
          name: customer

      - name: part_id
        description: foreign id for part
        entity:
          type: foreign
          name: part

      - name: supplier_id
        description: foreign id for suppliers
        entity:
          type: foreign
          name: supplier

      # Categorical Dimensions
      - name: order_item_status_code
        description: status of the order item
        dimension:
          type: categorical
          name: status_code

      - name: return_flag
        description: '{{ doc("return_flag") }}'
        dimension:
          type: categorical

      - name: ship_mode
        description: '{{ doc("ship_mode") }}'
        dimension:
          type: categorical

      # Time Dimensions
      - name: order_date
        description: date of the order
        granularity: day
        dimension:
          type: time

      - name: ship_date
        description: '{{ doc("ship_date") }}'
        granularity: day
        dimension:
          type: time

      - name: commit_date
        description: '{{ doc("commit_date") }}'
        granularity: day
        dimension:
          type: time

      - name: receipt_date
        description: '{{ doc("receipt_date") }}'
        granularity: day
        dimension:
          type: time

      # Remaining columns (no semantic annotation)
      - name: line_number
        description: '{{ doc("line_number") }}'

      - name: supplier_cost
        description: '{{ doc("cost") }}'

      - name: total_supplier_cost
        description: '{{doc("total_cost")}}'

      - name: base_price
        description: '{{ doc("base_price") }}'

      - name: discount_percentage
        description: '{{ doc("discount_percentage") }}'

      - name: discounted_price
        description: '{{ doc("discounted_price") }}'

      - name: tax_rate
        description: '{{ doc("tax_rate") }}'

      - name: order_item_count
        description: count of order items

      - name: quantity
        description: total units

      - name: gross_item_sales_amount
        description: '{{ doc("gross_item_sales_amount") }}'

      - name: discounted_item_sales_amount
        description: '{{ doc("discounted_item_sales_amount") }}'

      - name: item_discount_amount
        description: '{{ doc("item_discount_amount") }}'

      - name: item_tax_amount
        description: '{{ doc("item_tax_amount") }}'

      - name: net_item_sales_amount
        description: '{{ doc("net_item_sales_amount") }}'

    # Simple metrics (replace legacy measures)
    metrics:
      # Sums
      - name: item_cost
        description: Cost from the supplier for the order item.
        label: Item Cost
        type: simple
        agg: sum
        expr: supplier_cost

      - name: total_cost
        description: Cost from the supplier for the order item multiplied by the quantity purchased.
        label: Total Cost
        type: simple
        agg: sum
        expr: total_supplier_cost

      - name: base_price
        description: Base price of the order item.
        label: Item Price - Base
        type: simple
        agg: sum
        expr: base_price

      - name: discounted_price
        description: Discounted price of the order item.
        label: Item Price - Discounted
        type: simple
        agg: sum
        expr: discounted_price

      - name: quantity
        description: Total units of the order item.
        label: Item Quantity
        type: simple
        agg: sum
        expr: quantity

      - name: gross_item_sales_amount
        description: Gross sales amount of the order item.
        label: Sales Amount - Gross
        type: simple
        agg: sum
        expr: gross_item_sales_amount

      - name: discounted_item_sales_amount
        description: Discounted sales amount of the order item.
        label: Sales Amount - Discounted
        type: simple
        agg: sum
        expr: discounted_item_sales_amount

      - name: item_discount_amount
        description: Discount amount on the order item.
        label: Sales Discount
        type: simple
        agg: sum
        expr: item_discount_amount

      - name: item_tax_amount
        description: Tax amount on the order item.
        label: Sales Amount - Tax
        type: simple
        agg: sum
        expr: item_tax_amount

      - name: net_item_sales_amount
        description: Net sales amount of the order item.
        label: Sales Amount - Net
        type: simple
        agg: sum
        expr: net_item_sales_amount

      # Averages
      - name: discount_percentage_average
        description: Discount percentage applied to the order item.
        label: Sales Discount Percentage Average
        type: simple
        agg: average
        expr: discount_percentage

      - name: tax_rate_average
        description: Tax rate applied to the order item.
        label: Sales Tax Rate Average
        type: simple
        agg: average
        expr: tax_rate

      # Counts
      - name: count_order_item
        description: The count of order items.
        label: Count Order Items
        type: simple
        agg: count
        expr: order_item_id

      - name: count_order
        description: The count of orders.
        label: Count Orders
        type: simple
        agg: count_distinct
        expr: order_id

      - name: count_part
        description: The count of parts.
        label: Count Parts
        type: simple
        agg: count_distinct
        expr: part_id

      - name: count_supplier
        description: The count of suppliers.
        label: Count Suppliers
        type: simple
        agg: count_distinct
        expr: supplier_id
