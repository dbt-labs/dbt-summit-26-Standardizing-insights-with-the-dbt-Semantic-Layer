version: 2

groups:
  - name: finance
    owner:
      email: finance@jaffleshop.com
      name: Finance Person

models:
  - name: fct_order_items
    description: order items fact table
    semantic_model:
      enabled: true
      name: sem_order_items

    agg_time_dimension: order_date

    columns:
      - name: order_item_id
        description: '{{ doc("order_item_id") }}'
        data_tests:
          - unique
          - not_null
        entity:
          type: primary
          name: order_item
      - name: order_id
        description: foreign id for orders
        entity:
          type: foreign
          name: order_id
      - name: order_date
        description: date of the order
        granularity: day
        dimension:
          type: time
      - name: customer_id
        description: foreign id for customers
        entity:
          type: foreign
          name: customer
      - name: part_id
        description: foreign id for part
        entity:
          type: foreign
          name: part
      - name: supplier_id
        description: foreign id for suppliers
        entity:
          type: foreign
          name: supplier
      - name: order_item_status_code
        description: status of the order item
        dimension:
          type: categorical
      - name: return_flag
        description: '{{ doc("return_flag") }}'
        dimension:
          type: categorical
      - name: line_number
        description: '{{ doc("line_number") }}'
      - name: ship_date
        description: '{{ doc("ship_date") }}'
        granularity: day
        dimension:
          type: time
      - name: commit_date
        description: '{{ doc("commit_date") }}'
        granularity: day
        dimension:
          type: time
      - name: receipt_date
        description: '{{ doc("receipt_date") }}'
        granularity: day
        dimension:
          type: time
      - name: ship_mode
        description: '{{ doc("ship_mode") }}'
        dimension:
          type: categorical
      - name: supplier_cost
        description: '{{ doc("cost") }}'
      - name: total_supplier_cost
        description: '{{doc("total_cost")}}'
      - name: base_price
        description: '{{ doc("base_price") }}'
      - name: discount_percentage
        description: '{{ doc("discount_percentage") }}'
      - name: discounted_price
        description: '{{ doc("discounted_price") }}'
      - name: tax_rate
        description: '{{ doc("tax_rate") }}'
      - name: order_item_count
        description: count of order items
      - name: quantity
        description: total units
      - name: gross_item_sales_amount
        description: '{{ doc("gross_item_sales_amount") }}'
      - name: discounted_item_sales_amount
        description: '{{ doc("discounted_item_sales_amount") }}'
      - name: item_discount_amount
        description: '{{ doc("item_discount_amount") }}'
      - name: item_tax_amount
        description: '{{ doc("item_tax_amount") }}'
      - name: net_item_sales_amount
        description: '{{ doc("net_item_sales_amount") }}'

    metrics:
      - name: total_cost
        description: Total supplier cost for purchased order item quantities.
        label: Total Cost
        type: simple
        agg: sum
        expr: total_supplier_cost

      - name: gross_item_sales_amount
        description: Gross sales amount for order items.
        label: Gross Item Sales Amount
        type: simple
        agg: sum
        expr: gross_item_sales_amount

      - name: net_item_sales_amount
        description: Net sales amount for order items.
        label: Net Item Sales Amount
        type: simple
        agg: sum
        expr: net_item_sales_amount

      - name: met_cost_ratio
        description: Ratio of total supplier cost to gross item sales amount.
        label: Cost Ratio
        type: ratio
        numerator: total_cost
        denominator: gross_item_sales_amount

      - name: met_gross_profit
        description: Net item sales amount less total supplier cost.
        label: Gross Profit
        type: derived
        expr: net_sales - supplier_cost
        input_metrics:
          - name: net_item_sales_amount
            alias: net_sales
          - name: total_cost
            alias: supplier_cost
